<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <style>
    .bg {
      fill: #0f172a;
      transition: fill 0.3s ease;
    }
    .symbol {
      stroke: url(#indigo-grad);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.3s ease;
    }
    @media (prefers-color-scheme: light) {
      .bg {
        fill: #ffffff;
      }
      .symbol {
        stroke: #4f46e5;
      }
    }
  </style>
  <!-- Rounded background square -->
  <rect class="bg" width="100" height="100" rx="24" />
  
  <!-- Sleek geometric monogram forming a 'D' (Vertical pillar and sweeping data arc) -->
  <path class="symbol" d="M35 25V75M35 25H52C65 25 75 35 75 50C75 65 65 75 52 75H35" />
  
  <!-- Radiant Emerald Node representing digital automation excellence -->
  <circle cx="52" cy="50" r="6" fill="#10b981" />
</svg>
