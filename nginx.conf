server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for ultra-fast load (<1.5s)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security Headers inside container
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA Routing: Fallback all route requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Long-term Caching (1 Year)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SEO and Bot files (robots.txt, sitemap.xml, llms.txt)
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Allow ACME Challenge (Let's Encrypt validation)
    location ~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    # Deny other hidden files (.env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
